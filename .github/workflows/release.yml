# Cuts a release when a v* tag is pushed: binary archives via goreleaser,
# then the container image to GHCR, built from the repository's Dockerfile.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and the changelog from tags, and a
          # shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to the v2 line so a goreleaser major can't arrive mid-release.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest moves only for a tag without a prerelease suffix, so a
      # release candidate never reaches deployments that don't pin.
      - name: Compute image tags
        id: tags
        run: |
          image=ghcr.io/stone-age-io/atv-bridge
          tags="$image:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease tag, holding :latest at its current image" ;;
            *)   tags="$tags,$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          # The binary's version must be SemVer for the micro service, so the
          # leading v of the tag is dropped, as goreleaser does.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "will push: $tags"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/stone-age-io/atv-bridge
          cache-from: type=gha
          cache-to: type=gha,mode=max
