# A v* tag builds a Linux binary archive per architecture; the release
# workflow then pushes the container image.
version: 2

project_name: atv-bridge

builds:
  - id: atv-bridge
    main: ./cmd/atv-bridge
    binary: atv-bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # The version is also the micro service version, which must be SemVer.
      - -s -w -X main.version={{.Version}}
    # The bridge runs on Linux gateways. Nothing documents or tests it
    # anywhere else.
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: atv-bridge
    ids: [atv-bridge]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - docs/atv-bridge.md
      - config.example.yaml
    name_template: >-
      atv-bridge_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: skeeeon
    name: atv-bridge
  header: |
    ## atv-bridge {{ .Tag }}

    Controls Google TV and Android TV devices over NATS. Linux binary
    archives are below; the container image is
    `ghcr.io/skeeeon/atv-bridge:{{ .Tag }}`.
